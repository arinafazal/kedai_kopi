<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Pesan - Kedai Kopi Karsa</title>
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>Kedai Kopi Karsa</h1>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="menu.html">Menu</a>
        <a href="pesan.html">Pesan</a>
      </nav>
    </div>
  </header>

  <main>
    <h2>Form Pemesanan</h2>
    <p>Isi form dibawah ini untuk pesan minuman.</p>

    <form method="get" action="pesan.html">

      <div class="form-group">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required>
      </div>

      <div class="form-group">
        <label for="whatsapp">No. WhatsApp:</label>
        <input type="tel" id="whatsapp" name="whatsapp" required>
      </div>

      <div class="form-group">
        <label for="menu">Pilih Menu:</label>
        <select id="menu" name="menu">
          <option value="">-- Pilih --</option>
          <option value="espresso">Espresso - Rp 18.000</option>
          <option value="kopi_susu">Kopi Susu Gula Aren - Rp 22.000</option>
          <option value="latte">Caffe Latte - Rp 25.000</option>
          <option value="v60">V60 - Rp 26.000</option>
          <option value="matcha">Matcha Latte - Rp 24.000</option>
          <option value="coklat">Coklat - Rp 25.000</option>
          <option value="earl_grey">Earl Grey Milk Tea - Rp 22.000</option>
        </select>
      </div>

      <div class="form-group">
        <label for="jumlah">Jumlah:</label>
        <input type="number" id="jumlah" name="jumlah" min="1" max="10" value="1">
      </div>

      <div class="radio-group">
        <p>Cara pengambilan:</p>
        <input type="radio" id="ambil" name="cara_ambil" value="Ambil di tempat" required checked>
        <label for="ambil">Ambil di tempat</label>
        <input type="radio" id="diantar" name="cara_ambil" value="Diantar" required>
        <label for="diantar">Diantar</label>
      </div>

      <div class="form-group">
        <label for="catatan">Catatan:</label>
        <textarea id="catatan" name="catatan" rows="3"></textarea>
      </div>

      <button type="submit">Kirim</button>

    </form>
  </main>

  <footer>
    <p>Alamat: Jl. Iwenisari, Tembalang, Kota Semarang, Jawa Tengah</p>
    <p>Buka setiap hari mulai pukul 08.00 WIB</p>
    <p>&copy; 2026 Kedai Kopi Karsa</p>
  </footer>

</body>
</html>
